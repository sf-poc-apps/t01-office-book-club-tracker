{% extends "base.html" %}
{% block title %}Add a book{% endblock %}
{% block content %}
<h1>Add a book</h1>
{% if error %}<p class="error">Please fill in all fields. Month must look like 2026-05.</p>{% endif %}
<form method="post" action="/books" class="card">
  <label>Title <input name="title" required maxlength="200"></label>
  <label>Author <input name="author" required maxlength="200"></label>
  <label>Suggested by (first name) <input name="suggested_by" required maxlength="200"></label>
  <label>Month (YYYY-MM) <input name="month" required maxlength="7" pattern="\d{4}-\d{2}" placeholder="2026-05"></label>
  <button type="submit">Save</button>
</form>
<p><a href="/">Back to the list</a></p>
{% endblock %}
